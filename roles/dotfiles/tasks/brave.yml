---
# Brave pelo repositório oficial (mesmo conteúdo do brave-browser.sources que
# o Brave publica) + "debloat" opcional por políticas.
#
# O debloat usa as políticas oficiais do Brave (as mesmas que empresas usam):
# um JSON em /etc/brave/policies/managed/. Sobrevive a atualizações e aparece
# em brave://policy. Os nomes foram conferidos nas definições do código-fonte
# (brave-core: components/policy/.../BraveSoftware) e todos valem no Linux.
# A lista fica em brave_politicas (defaults/main.yml) para ajustar.

- name: "Baixar chave oficial do repositório do Brave"
  become: true
  get_url:
    url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
    dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
    mode: '0644'
  tags: brave

- name: "Remover repositório antigo do Brave (formato .list)"
  become: true
  file:
    path: /etc/apt/sources.list.d/brave-browser-release.list
    state: absent
  tags: brave

- name: "Adicionar repositório oficial do Brave (deb822)"
  become: true
  deb822_repository:
    name: brave-browser
    types: deb
    uris: https://brave-browser-apt-release.s3.brave.com
    suites: stable
    components: main
    architectures: amd64
    signed_by: /usr/share/keyrings/brave-browser-archive-keyring.gpg
  register: brave_repo
  tags: brave

- name: "Instalar Brave"
  become: true
  apt:
    name: brave-browser
    state: present
    update_cache: "{{ brave_repo is changed }}"
  tags: brave

- name: "Garantir pasta de políticas do Brave"
  become: true
  file:
    path: /etc/brave/policies/managed
    state: directory
    mode: '0755'
  when: brave_debloat | bool
  tags: brave

- name: "Aplicar debloat do Brave (políticas)"
  become: true
  copy:
    dest: /etc/brave/policies/managed/debloat.json
    content: "{{ brave_politicas | to_nice_json(indent=2) }}\n"
    mode: '0644'
  when: brave_debloat | bool
  tags: brave

- name: "Remover debloat do Brave (toggle desligado)"
  become: true
  file:
    path: /etc/brave/policies/managed/debloat.json
    state: absent
  when: not (brave_debloat | bool)
  tags: brave
