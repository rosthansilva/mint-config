---
# O fastfetch não está nos repositórios oficiais do Mint 22.x/Ubuntu noble,
# e a PPA zhangsongcui3371/fastfetch não publica build pra "noble" (o
# add-apt-repository falha com "OS codename: 'noble'. This codename isn't
# currently supported."). Por isso instalamos o .deb oficial direto do
# GitHub Releases, do mesmo jeito que o devcontainer.yml já faz com outras
# ferramentas.
- name: "Verificar se o Fastfetch já está instalado"
  command: fastfetch --version
  register: fastfetch_check
  ignore_errors: yes
  changed_when: false
  tags: fastfetch

- name: "Baixar o .deb oficial do Fastfetch (GitHub Releases)"
  get_url:
    url: "https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb"
    dest: /tmp/fastfetch-linux-amd64.deb
    mode: '0644'
  when: fastfetch_check.rc != 0
  tags: fastfetch

- name: "Instalar Fastfetch (.deb baixado)"
  become: true
  apt:
    deb: /tmp/fastfetch-linux-amd64.deb
  when: fastfetch_check.rc != 0
  tags: fastfetch

- name: "Criar diretório de configuração do Fastfetch"
  file:
    path: "{{ ansible_env.HOME }}/.config/fastfetch"
    state: directory
    mode: '0755'
  tags: fastfetch

- name: "Configurar preset Nord Teal no Fastfetch"
  copy:
    dest: "{{ ansible_env.HOME }}/.config/fastfetch/config.jsonc"
    content: |
      {
        "$schema": "https://github.com/fastfetch-cli/fastfetch/raw/dev/doc/json_schema.json",
        "logo": {
          "type": "small",
          "padding": {
            "top": 2,
            "left": 2
          },
          "color": {
            "1": "36",
            "2": "36"
          }
        },
        "display": {
          "separator": " ➜  ",
          "color": {
            "keys": "cyan",
            "title": "cyan"
          }
        },
        "modules": [
          "title",
          "separator",
          "os",
          "host",
          "kernel",
          "uptime",
          "packages",
          "shell",
          "display",
          "de",
          "wm",
          "terminal",
          "cpu",
          "gpu",
          "memory",
          "break",
          "colors"
        ]
      }
    mode: '0644'
  tags: fastfetch