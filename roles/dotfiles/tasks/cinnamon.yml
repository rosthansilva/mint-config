---
- name: Instalar dconf-cli (via Nala)
  become: true
  command: nala install -y dconf-cli
  register: dconf_install
  changed_when: "'Installing' in dconf_install.stdout"
  tags: theme

- name: Instalar dconf-cli e jq (via Nala)
  become: true
  ansible.builtin.package: # Usar package é mais limpo que chamar o comando nala direto
    name:
      - dconf-cli
      - jq
    state: present
  tags: theme
# --- ASSETS (WALLPAPER E ÍCONES) ---

- name: Garantir diretório de wallpapers do sistema
  become: true
  file:
    path: "/usr/share/backgrounds/wallpapers"
    state: directory
    mode: '0755'
  tags: theme

- name: Copiar Wallpaper personalizado
  become: true
  copy:
    src: "wallpaperflare.jpg"
    dest: "/usr/share/backgrounds/wallpapers/wallpaperflare.jpg"
    mode: '0644'
  tags: theme

- name: Garantir diretório de ícones personalizados do usuário
  file:
    path: "{{ ansible_env.HOME }}/.local/share/icons/custom"
    state: directory
    mode: '0755'
  tags: theme

- name: Instalar ícone do Menu
  copy:
    src: "start-menu-icon/quad-grid.svg"
    dest: "{{ ansible_env.HOME }}/.local/share/icons/custom/menu-icon.svg"
    mode: '0644'
  tags: theme

# --- CONFIGURAÇÃO GERAL DO CINNAMON ---

- name: Gerar arquivo de configuração Dconf
  copy:
    dest: "/tmp/cinnamon_dconf.conf"
    mode: '0644'
    content: |
      [/]
      alttab-switcher-delay=100
      enabled-applets=['panel1:left:0:menu@cinnamon.org:0', 'panel1:right:3:systray@cinnamon.org:3', 'panel1:right:4:xapp-status@cinnamon.org:4', 'panel1:right:5:notifications@cinnamon.org:5', 'panel1:right:6:printers@cinnamon.org:6', 'panel1:right:7:removable-drives@cinnamon.org:7', 'panel1:right:8:keyboard@cinnamon.org:8', 'panel1:right:9:favorites@cinnamon.org:9', 'panel1:right:10:network@cinnamon.org:10', 'panel1:right:11:sound@cinnamon.org:11', 'panel1:right:12:power@cinnamon.org:12', 'panel1:center:0:calendar@cinnamon.org:13', 'panel1:right:1:temperature@fevimu:15', 'panel1:right:13:placesCenter@scollins:16', 'panel1:right:2:ScreenShot+RecordDesktop@tech71:17', 'panel1:right:14:user@cinnamon.org:18', 'panel1:left:2:workspace-switcher@cinnamon.org:19', 'panel1:right:15:spacer@cinnamon.org:20']
      panels-enabled=['1:0:top']
      panels-height=['1:34']

      [desktop/background]
      picture-options='zoom'
      picture-uri='file:///usr/share/backgrounds/wallpapers/wallpaperflare.jpg'

      [desktop/interface]
      cursor-theme='{{ cursor_theme_name | default("Catppuccin-Mocha-Dark-Cursors") }}'
      gtk-theme='{{ theme_name | default("Colloid-Teal-Dark-Nord") }}'
      icon-theme='{{ icon_theme_name | default("Colloid-Teal-Nord-Dark") }}'

      [theme]
      name='{{ theme_name | default("Colloid-Teal-Dark-Nord") }}'
  tags: theme

- name: Aplicar configurações gerais no Cinnamon
  shell: "dconf load /org/cinnamon/ < /tmp/cinnamon_dconf.conf"
  args:
    executable: /bin/bash
  tags: theme

# --- CONFIGURAÇÃO DO MENU (APPLET) ---

- name: Garantir diretório do menu
  file:
    path: "{{ ansible_env.HOME }}/.config/cinnamon/spices/menu@cinnamon.org"
    state: directory
    mode: '0755'
  tags: theme

- name: Aplicar JSON do menu
  template:
    src: "cinnamon-menu.json.j2"
    dest: "{{ ansible_env.HOME }}/.config/cinnamon/spices/menu@cinnamon.org/0.json"
    mode: '0644'
  tags: theme

# --- APLICAR MENU VIA DCONF (CORRIGIDO) ---

- name: Verificar config atual do menu
  command: dconf dump /org/cinnamon/applets/menu/0/
  register: menu_dconf_current
  changed_when: false
  failed_when: false
  tags: theme

- name: Aplicar configuração do menu via dconf
  shell: >
    jq '.["menu-icon"].value = "{{ ansible_env.HOME }}/.local/share/icons/custom/menu-icon.svg"' ~/.config/cinnamon/spices/menu@cinnamon.org/0.json > temp.json && mv temp.json ~/.config/cinnamon/spices/menu@cinnamon.org/0.json
  args:
    executable: /bin/bash
  when: menu_dconf_current.stdout == ""
  tags: theme

# --- FINALIZAÇÃO ---

- name: Reiniciar Cinnamon
  command: cinnamon --replace &
  async: 1
  poll: 0
  ignore_errors: true
  when: menu_dconf_current.stdout == ""
  tags: theme

- name: Limpar arquivo temporário
  file:
    path: "/tmp/cinnamon_dconf.conf"
    state: absent
  tags: theme