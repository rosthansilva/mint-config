---
# Ajustes de sistema para áudio sem estalos (xruns). Valem após reiniciar.
#   - preempt=full: o kernel interrompe tarefas longas para atender o áudio
#     (é o que o antigo kernel "lowlatency" fazia; o kernel genérico do
#     Ubuntu/Mint suporta via PREEMPT_DYNAMIC);
#   - threadirqs: interrupções viram threads com prioridade ajustável;
#   - usbcore.autosuspend=-1: a interface de áudio USB não "dorme".

- name: "Garantir diretório de configurações extras do GRUB"
  become: true
  file:
    path: /etc/default/grub.d
    state: directory
    mode: '0755'
  when: otimizar_latencia_audio | bool
  tags: latencia

- name: "Adicionar parâmetros de baixa latência ao kernel (GRUB)"
  become: true
  copy:
    dest: /etc/default/grub.d/99-audio-baixa-latencia.cfg
    content: |
      # Gerenciado pelo Ansible (roles/dotfiles/tasks/latencia.yml)
      GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT preempt=full threadirqs usbcore.autosuspend=-1"
    mode: '0644'
  register: latencia_grub
  when: otimizar_latencia_audio | bool
  tags: latencia

- name: "Remover parâmetros de baixa latência do kernel (toggle desligado)"
  become: true
  file:
    path: /etc/default/grub.d/99-audio-baixa-latencia.cfg
    state: absent
  register: latencia_grub_off
  when: not (otimizar_latencia_audio | bool)
  tags: latencia

- name: "Verificar se o GRUB está presente"
  stat:
    path: /boot/grub/grub.cfg
  register: latencia_grub_cfg
  tags: latencia

- name: "Regenerar configuração do GRUB"
  become: true
  command: update-grub
  when:
    - latencia_grub is changed or latencia_grub_off is changed
    - latencia_grub_cfg.stat.exists
  tags: latencia

# Versões anteriores deste projeto criavam um serviço que deixava a CPU
# sempre na frequência máxima. Foi removido (mais calor e consumo por pouco
# ganho); se ainda existir, é desativado e apagado, e a CPU volta ao
# controle padrão do sistema a partir do próximo boot.
- name: "Verificar serviço antigo de CPU em modo performance"
  stat:
    path: /etc/systemd/system/cpu-performance.service
  register: latencia_cpu_servico
  tags: latencia

- name: "Desativar serviço antigo de CPU em modo performance"
  become: true
  systemd:
    name: cpu-performance.service
    enabled: no
  when: latencia_cpu_servico.stat.exists
  tags: latencia

- name: "Apagar serviço antigo de CPU em modo performance"
  become: true
  file:
    path: /etc/systemd/system/cpu-performance.service
    state: absent
  register: latencia_cpu_removido
  tags: latencia

- name: "Recarregar o systemd após remover o serviço"
  become: true
  systemd:
    daemon_reload: yes
  when: latencia_cpu_removido is changed
  tags: latencia
